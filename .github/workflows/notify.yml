name: Notify

# Gotify pings in place of GitHub's emails: a failed Vercel or artifact check on a Renovate
# branch, Renovate PRs labeled review or security, merged Renovate PRs (priority 0, history
# only), and PRs opened by anyone else (forks, since only the owner can push here).
#
# Public repo: status and pull_request_target both run this file from main, so a branch can't
# change what runs with GOTIFY_TOKEN. Nothing here checks out or runs PR code; keep it that way.
on:
  status:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no checkout; needed so fork PRs ping
    types: [opened, labeled, closed]

permissions: {}

jobs:
  check-failed:
    name: Check failed on Renovate branch
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'status' &&
      (github.event.state == 'failure' || github.event.state == 'error') &&
      (github.event.context == 'Vercel' || github.event.context == 'renovate/artifacts') &&
      startsWith(github.event.branches[0].name, 'renovate/')
    permissions:
      pull-requests: read
    steps:
      # GOTIFY_TOKEN (secret) + GOTIFY_URL (variable) are set by nalwin-gotify's gotify-apply.
      # Values go through env: and jq --arg, never ${{ }} inside run: (branch names, PR titles
      # and status descriptions are untrusted).
      - name: Gotify notification
        env:
          GH_TOKEN: ${{ github.token }}
          GOTIFY_URL: ${{ vars.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          CONTEXT: ${{ github.event.context }}
          BRANCH: ${{ github.event.branches[0].name }}
          DESCRIPTION: ${{ github.event.description }}
          TARGET: ${{ github.event.target_url }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --json url --jq '.[0].url // ""')
          msg="Branch: $BRANCH"
          if [ -n "$DESCRIPTION" ]; then msg+=$'\n'"$DESCRIPTION"; fi
          if [ -n "$pr" ]; then msg+=$'\n'"PR: $pr"; fi
          # Vercel's target is the build log; renovate/artifacts has none, so fall back to the PR
          link=${TARGET:-${pr:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY}}
          jq -n --arg t "❌ ${GITHUB_REPOSITORY#*/}: $CONTEXT failed" --arg m "$msg" --arg u "$link" \
            '{title: $t, message: $m, extras: {"client::notification": {click: {url: $u}}}}' |
            curl -fsS --retry 3 --max-time 10 -X POST "$GOTIFY_URL/message" \
              -H "X-Gotify-Key: $GOTIFY_TOKEN" -H 'Content-Type: application/json' --data @-

  renovate-labeled:
    name: Renovate PR labeled review or security
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'review' || github.event.label.name == 'security') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'renovatebot-davie3[bot]'
    steps:
      - name: Gotify notification
        env:
          GOTIFY_URL: ${{ vars.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          LABEL: ${{ github.event.label.name }}
          PR: 'PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}'
          LINK: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$LABEL" = review ]; then title='⚠️ Manual Review Required'; else title='🔒 Security update'; fi
          jq -n --arg t "${GITHUB_REPOSITORY#*/}: $title" --arg m "$PR" --arg u "$LINK" \
            '{title: $t, message: $m, extras: {"client::notification": {click: {url: $u}}}}' |
            curl -fsS --retry 3 --max-time 10 -X POST "$GOTIFY_URL/message" \
              -H "X-Gotify-Key: $GOTIFY_TOKEN" -H 'Content-Type: application/json' --data @-

  renovate-merged:
    name: Renovate PR merged
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'renovatebot-davie3[bot]'
    steps:
      - name: Gotify notification
        env:
          GOTIFY_URL: ${{ vars.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          PR: 'PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}'
          LINK: ${{ github.event.pull_request.html_url }}
        run: |
          jq -n --arg t "✅ ${GITHUB_REPOSITORY#*/}: Renovate merged" --arg m "$PR" --arg u "$LINK" \
            '{title: $t, message: $m, priority: 0, extras: {"client::notification": {click: {url: $u}}}}' |
            curl -fsS --retry 3 --max-time 10 -X POST "$GOTIFY_URL/message" \
              -H "X-Gotify-Key: $GOTIFY_TOKEN" -H 'Content-Type: application/json' --data @-

  outside-pr:
    name: PR opened by someone else
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'opened' &&
      github.event.pull_request.user.login != github.repository_owner &&
      github.event.pull_request.user.login != 'renovatebot-davie3[bot]'
    steps:
      - name: Gotify notification
        env:
          GOTIFY_URL: ${{ vars.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: 'PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}'
          LINK: ${{ github.event.pull_request.html_url }}
        run: |
          jq -n --arg t "📬 ${GITHUB_REPOSITORY#*/}: PR from $AUTHOR" --arg m "$PR" --arg u "$LINK" \
            '{title: $t, message: $m, extras: {"client::notification": {click: {url: $u}}}}' |
            curl -fsS --retry 3 --max-time 10 -X POST "$GOTIFY_URL/message" \
              -H "X-Gotify-Key: $GOTIFY_TOKEN" -H 'Content-Type: application/json' --data @-
